<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse station · Read the Room</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f5f8; color: #17202b; font-family: system-ui, sans-serif; }
  header { background: #17202b; color: #fff; padding: 14px 20px; display: flex;
           flex-wrap: wrap; gap: 10px; align-items: center; }
  header h1 { font-size: 18px; margin: 0 auto 0 0; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 12px; background: #2b3948; }
  .chip.bad { background: #b3261e; } .chip.good { background: #1e7a47; }
  #banner { display: none; background: #b3261e; color: #fff; padding: 12px 20px; font-weight: 600; }
  section { max-width: 760px; margin: 0 auto; padding: 16px 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: #5b6878; }
  .alert { background: #fff; border-left: 8px solid #d98b00; border-radius: 8px; padding: 14px 16px;
           margin-bottom: 10px; display: flex; align-items: center; gap: 12px; }
  .alert .msg { font-size: 19px; font-weight: 600; }
  .alert .meta { font-size: 13px; color: #5b6878; margin-top: 3px; }
  .alert .body { margin-right: auto; }
  .alert.escalated { border-left-color: #b3261e; animation: pulse 1s infinite; }
  .alert.acked { border-left-color: #1e7a47; opacity: .6; }
  .alert.acked button { display: none; }
  @keyframes pulse { 50% { background: #fde7e5; } }
  @media (prefers-reduced-motion: reduce) { .alert.escalated { animation: none; background: #fde7e5; } }
  button { font: inherit; padding: 10px 16px; border: 0; border-radius: 6px; background: #17202b;
           color: #fff; cursor: pointer; }
  button.light { background: #dfe4ea; color: #17202b; margin: 0 6px 6px 0; }
  #empty { color: #5b6878; }
  #check { font-size: 14px; color: #5b6878; margin-top: 8px; }
  #debug { display: none; }
  input { font: inherit; padding: 8px; width: 90px; }
</style>
</head>
<body>
<header>
  <h1 id="bed">Read the Room</h1>
  <span class="chip" id="conn">Connecting…</span>
  <span class="chip" id="face"></span>
  <span class="chip" id="temp"></span>
  <span class="chip" id="perf"></span>
</header>
<div id="banner"></div>
<section>
  <h2>Requests</h2>
  <div id="empty">No requests yet.</div>
  <div id="alerts"></div>
</section>
<section>
  <h2>Setup</h2>
  <button id="calibrate">Start calibration</button>
  <button class="light" id="previewBtn">Show camera view</button>
  <div id="check"></div>
  <div id="previewBox" style="display:none">
    <img id="preview" alt="Camera view" style="max-width:100%;border-radius:8px;margin-top:10px">
    <div id="previewHelp" style="font-size:14px;margin-top:6px"></div>
  </div>
</section>
<section id="scene" style="display:none">
  <h2>Room scan</h2>
  <div id="sceneStatus"></div>
  <ul id="spots"></ul>
  <button class="light" id="relearn">Learn spots again</button>
</section>
<section id="debug">
  <h2>Simulation: where is the patient looking?</h2>
  <div id="gaze"></div>
  <p>Room temperature °C <input id="t" type="number" step="0.5">
     <button class="light" id="setT">Set</button> <button class="light" id="clearT">Clear</button></p>
</section>
<script>
const $ = id => document.getElementById(id);
const post = (path, body) => fetch(path, {method: 'POST', body: JSON.stringify(body || {})});
const cards = new Map();
const seen = new Map();
let audio = null, debugBuilt = false;
document.addEventListener('pointerdown', () => { audio = audio || new AudioContext(); }, {once: true});
function beep(freq, n) {
  if (!audio) return;
  for (let i = 0; i < n; i++) {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * .25;
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.start(t); o.stop(t + .2);
  }
}
function chip(id, text, cls) { $(id).textContent = text; $(id).className = 'chip ' + (cls || ''); }

function render(s) {
  const st = s.status;
  $('bed').textContent = s.bed + ' · Read the Room';
  chip('conn', 'Device online', 'good');
  chip('face', st.face_ok ? 'Patient in view' : 'Patient not in view', st.face_ok ? 'good' : 'bad');
  chip('temp', st.temp_c == null ? 'No temperature' : st.temp_c.toFixed(1) + ' °C');
  chip('perf', st.fps + ' fps · ' + st.tick_ms + ' ms');
  const banner = $('banner');
  banner.style.display = st.face_lost || st.too_slow ? 'block' : 'none';
  banner.textContent = st.face_lost
    ? s.bed + ': the device cannot see the patient. Requests cannot be made until this is fixed.'
    : s.bed + ': the device is running too slowly (' + st.fps + ' frames per second) to read gaze reliably.';

  const ids = new Set(s.alerts.map(a => a.id));
  for (const [id, el] of cards) if (!ids.has(id)) { el.remove(); cards.delete(id); seen.delete(id); }
  s.alerts.slice().reverse().forEach(a => {
    let el = cards.get(a.id);
    if (!el) {
      el = document.createElement('div');
      const body = document.createElement('div'); body.className = 'body';
      const msg = document.createElement('div'); msg.className = 'msg'; msg.textContent = a.message;
      const meta = document.createElement('div'); meta.className = 'meta';
      const btn = document.createElement('button'); btn.textContent = 'On my way';
      btn.onclick = () => post('/api/ack', {id: a.id});
      body.append(msg, meta); el.append(body, btn);
      $('alerts').prepend(el);
      cards.set(a.id, el);
    }
    el.className = 'alert ' + a.state;
    const at = new Date(a.created_at * 1000).toLocaleTimeString();
    const wait = Math.max(0, Math.round((a.acked_at || s.time) - a.created_at));
    el.querySelector('.meta').textContent = a.state === 'acked'
      ? at + ' · answered after ' + wait + ' s'
      : at + ' · waiting ' + wait + ' s' + (a.urgent ? ' · URGENT' : a.state === 'escalated' ? ' · OVERDUE' : '');
    if (seen.get(a.id) !== a.state) {
      if (a.state === 'escalated') beep(880, 3); else if (a.state === 'pending') beep(660, 1);
      seen.set(a.id, a.state);
    }
  });
  $('empty').style.display = s.alerts.length ? 'none' : 'block';

  const cal = s.calibration;
  const results = Object.entries(s.self_check).map(([k, v]) => k + ' ' + Math.round(v * 100) + '%');
  const weak = Object.entries(s.self_check).filter(([k, v]) => v < 0.7).map(([k]) => k);
  $('check').textContent = cal.active ? 'Calibrating: step ' + cal.step + ' of ' + cal.steps
    : cal.error ? cal.error
    : st.simulate ? 'Simulation mode: calibration is not needed.'
    : !s.calibrated ? 'Not calibrated.'
    : results.length ? 'Repeat check (second look recognised from the first): ' + results.join(', ')
        + (weak.length ? '. NOT RELIABLE: ' + weak.join(', ')
           + '. Move these further from other targets, add light, and calibrate again.' : '')
    : 'Calibrated (loaded from last run).';

  previewOn = st.preview;
  $('previewBtn').style.display = st.simulate ? 'none' : '';
  $('previewBtn').textContent = st.preview ? 'Hide camera view' : 'Show camera view';
  $('previewBox').style.display = st.preview ? 'block' : 'none';
  if (st.preview) {
    const tips = [];
    if (st.face_width == null) tips.push('No face found: aim the camera at the patient.');
    else {
      const pct = Math.round(st.face_width * 100);
      tips.push('Face fills ' + pct + '% of the width'
        + (pct < 22 ? ': too far, move the camera closer.' : pct > 45 ? ': too close, move it back.' : ': good.'));
      tips.push(st.gaze_ok ? 'Eyes readable (green box).' : 'Eyes not readable (red box).');
    }
    if (st.brightness != null) tips.push('Brightness ' + st.brightness + '/255'
      + (st.brightness < 60 ? ': too dark, add light on the face.' : st.brightness < 100 ? ': a bit dim.' : ': good.'));
    tips.push('Mirrored view. Switches off by itself after 3 minutes.');
    $('previewHelp').textContent = tips.join(' ');
  }

  if (s.scene) {
    const sc = s.scene;
    $('scene').style.display = 'block';
    $('sceneStatus').textContent = sc.age_s == null ? 'Waiting for the first photo from the scene camera.'
      : sc.error ? sc.error
      : (sc.age_s > 30 ? 'SCENE CAMERA SILENT for ' + Math.round(sc.age_s) + ' s. ' : 'Last photo ' + Math.round(sc.age_s) + ' s ago. ')
        + 'Scan took ' + sc.ms + ' ms. Sees: '
        + (sc.found.map(f => f.label + ' ' + Math.round(f.score * 100) + '%').join(', ') || 'nothing it knows') + '.';
    const lines = sc.spots.map(p => p.zone + ': '
      + (!p.located ? 'not found yet (expecting a ' + p.expected + ')'
         : p.now + (p.now !== p.expected ? ' (was ' + p.expected + ')' : '') + (p.seen ? '' : ', not visible in the last photo')));
    const list = $('spots');
    if (list.dataset.key !== lines.join('|')) {
      list.dataset.key = lines.join('|');
      list.replaceChildren(...lines.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));
    }
  }

  if (st.simulate && !debugBuilt) {
    debugBuilt = true;
    $('debug').style.display = 'block';
    const opts = [['rest', 'Screen centre'], ['yes', 'YES'], ['no', 'NO']]
      .concat(s.zones.map(z => [z.id, z.label]), [[null, 'Elsewhere'], ['noface', 'Face hidden']]);
    opts.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'light'; b.textContent = label;
      b.onclick = () => post('/api/debug/gaze', {label: id});
      $('gaze').appendChild(b);
    });
  }
}

$('calibrate').onclick = () => post('/api/calibrate');
let previewOn = false;
$('previewBtn').onclick = () => post('/api/preview', {on: !previewOn});
setInterval(() => { if (previewOn) $('preview').src = '/preview.jpg?t=' + Date.now(); }, 250);
$('relearn').onclick = () => post('/api/scene/reset');
$('setT').onclick = () => post('/api/debug/temp', {temp_c: parseFloat($('t').value)});
$('clearT').onclick = () => post('/api/debug/temp', {temp_c: null});
let lastMessage = 0, bedName = 'Device';
function offline(text) {
  chip('conn', text, 'bad');
  $('banner').style.display = 'block';
  $('banner').textContent = bedName + ': ' + text.toLowerCase() + '. The patient cannot make requests.';
}
const es = new EventSource('/events?role=nurse');
es.onmessage = e => { lastMessage = Date.now(); const s = JSON.parse(e.data); bedName = s.bed; render(s); };
es.onerror = () => offline('Device offline');
setInterval(() => {
  if (lastMessage && Date.now() - lastMessage > 3000) offline('Device not responding');
}, 1000);
</script>
</body>
</html>
