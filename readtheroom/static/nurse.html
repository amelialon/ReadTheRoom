<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nurse station · Read the Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  body { min-height: 100dvh; padding: 0 24px 48px; }

  /* A floating island instead of a bar glued to the top. */
  #island { position: sticky; top: 20px; z-index: 2; margin: 20px auto 0; width: max-content; max-width: 100%;
            display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 20px; border-radius: 999px;
            background: rgba(255, 255, 255, .78); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            box-shadow: var(--highlight), var(--shadow-lift); }
  #bed { font-weight: 700; font-size: 16px; letter-spacing: -.02em; margin-right: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px;
          font-size: 13px; font-weight: 600; color: var(--ink-2); background: var(--plate-soft); }
  .chip::before { content: ""; width: 6px; height: 6px; border-radius: 999px; background: var(--ink-3); }
  .chip.good::before { background: var(--accent); }
  .chip.bad { color: var(--danger); background: var(--danger-wash); }
  .chip.bad::before { background: var(--danger); }
  #perf { color: var(--ink-3); }
  #perf::before { display: none; }

  #banner { display: none; max-width: 1240px; margin: 20px auto 0; padding: 14px 20px; border-radius: var(--r-md);
            background: var(--danger-wash); color: var(--danger); font-weight: 600; }

  /* The bento: requests large on the left, the device's state stacked on the right. */
  #grid { max-width: 1240px; margin: 28px auto 0; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr));
          gap: 20px; }
  .tile { grid-column: span 12; }
  .tile .core { padding: 26px 28px; display: flex; flex-direction: column; gap: 16px; height: 100%; }
  @media (min-width: 900px) {
    #requests { grid-column: span 7; grid-row: span 2; }
    #patient, #scene { grid-column: span 5; }
  }
  h2 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.03em; }
  .head { display: flex; align-items: center; gap: 12px; }
  .head .tag { margin-left: auto; }
  .note { font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .quiet { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
  a { color: var(--ink-2); }

  /* Requests: soft plates, newest first. */
  #alerts { display: flex; flex-direction: column; gap: 10px; }
  .alert { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: var(--r-lg);
           background: var(--plate-soft); transition: background 500ms var(--ease), opacity 500ms var(--ease); }
  .alert .body { margin-right: auto; display: flex; flex-direction: column; gap: 4px; }
  .alert .msg { font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
  .alert .meta { font-size: 13px; color: var(--ink-2); }
  .alert.pending { background: var(--accent-wash); }
  .alert.escalated { background: var(--danger-wash); }
  .alert.escalated .meta { color: var(--danger); font-weight: 600; }
  .alert.acked { opacity: .55; }
  .alert.acked .pill { display: none; }
  #empty { padding: 36px 0; text-align: center; color: var(--ink-3); }

  /* Camera view with a soft frame around the face. */
  #previewBox { display: none; }
  #previewWrap { position: relative; display: inline-block; line-height: 0; border-radius: var(--r-md); overflow: hidden;
                 box-shadow: 0 0 0 1px var(--edge); }
  #preview { max-width: 100%; display: block; }
  #faceFrame { position: absolute; display: none; border: 2px solid var(--accent); border-radius: 28%; pointer-events: none; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #spots { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  #debug { display: none; }
  input { font: inherit; padding: 9px 12px; width: 96px; border-radius: 999px; border: 0; background: var(--plate-soft);
          box-shadow: 0 0 0 1px var(--edge); }
  #gaze { display: flex; flex-wrap: wrap; gap: 8px; }
</style>
</head>
<body>
<div id="island">
  <span id="bed">Read the Room</span>
  <span class="chip" id="conn">Connecting</span>
  <span class="chip" id="face"></span>
  <span class="chip" id="temp"></span>
  <span class="chip" id="perf"></span>
</div>
<div id="banner"></div>
<div id="grid">
  <section class="tile shell arrive" id="requests"><div class="core">
    <div class="head"><h2>Requests</h2>
      <button class="pill soft" id="clearDone" style="padding:8px 14px;font-size:13px">Clear answered</button></div>
    <div id="empty">No requests yet.</div>
    <div id="alerts"></div>
  </div></section>

  <section class="tile shell arrive" id="patient"><div class="core">
    <div class="head"><h2>Patient</h2><span class="tag" id="calState"></span></div>
    <div class="note" id="check"></div>
    <div class="quiet" id="meter"></div>
    <div class="row">
      <button class="pill" id="calibrate">Start calibration <span class="go">&#8594;</span></button>
      <button class="pill soft" id="previewBtn">Show camera view</button>
      <a href="/room" target="_blank" style="font-size:14px">Room view</a>
    </div>
    <div id="previewBox">
      <div id="previewWrap"><img id="preview" alt="Camera view"><div id="faceFrame"></div></div>
      <div class="note" id="previewHelp" style="margin-top:8px"></div>
    </div>
  </div></section>

  <section class="tile shell arrive" id="scene" style="display:none"><div class="core">
    <div class="head"><h2>Room scan</h2><button class="pill soft" id="relearn" style="margin-left:auto;padding:8px 14px;font-size:13px">Learn spots again</button></div>
    <div class="note" id="sceneStatus"></div>
    <ul id="spots"></ul>
  </div></section>

  <section class="tile shell arrive" id="debug"><div class="core">
    <div class="head"><h2>Simulation</h2><span class="tag">Where the patient is looking</span></div>
    <div id="gaze"></div>
    <p class="note" id="simHelp" style="margin:0"></p>
    <div class="row">Room temperature °C <input id="t" type="number" step="0.5">
      <button class="pill soft" id="setT" style="padding:8px 14px;font-size:13px">Set</button>
      <button class="pill soft" id="clearT" style="padding:8px 14px;font-size:13px">Clear</button></div>
  </div></section>
</div>
<script>
const $ = id => document.getElementById(id);
const post = (path, body) => fetch(path, {method: 'POST', body: JSON.stringify(body || {})});
const cards = new Map();
const seen = new Map();
let audio = null, debugBuilt = false;
document.addEventListener('pointerdown', () => { audio = audio || new AudioContext(); }, {once: true});
function beep(freq, n) {
  if (!audio) return;
  for (let i = 0; i < n; i++) {
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + i * .25;
    o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.2, t); g.gain.exponentialRampToValueAtTime(.001, t + .2);
    o.start(t); o.stop(t + .2);
  }
}
function chip(id, text, cls) { $(id).textContent = text; $(id).className = 'chip ' + (cls || ''); }

function render(s) {
  const st = s.status, ses = s.session;
  $('bed').textContent = s.bed;
  chip('conn', 'Online', 'good');
  chip('face', st.face_ok ? 'Patient in view' : 'Patient not in view', st.face_ok ? 'good' : 'bad');
  chip('temp', st.temp_c == null ? 'No temperature' : st.temp_c.toFixed(1) + ' °C');
  chip('perf', st.fps + ' fps');
  const banner = $('banner');
  banner.style.display = st.face_lost || st.too_slow ? 'block' : 'none';
  banner.textContent = st.face_lost
    ? s.bed + ': the device cannot see the patient. Requests cannot be made until this is fixed.'
    : s.bed + ': the device is running too slowly (' + st.fps + ' frames per second) to read gaze reliably.';

  const ids = new Set(s.alerts.map(a => a.id));
  for (const [id, el] of cards) if (!ids.has(id)) { el.remove(); cards.delete(id); seen.delete(id); }
  s.alerts.slice().reverse().forEach(a => {
    let el = cards.get(a.id);
    if (!el) {
      el = document.createElement('div');
      const body = document.createElement('div'); body.className = 'body';
      const msg = document.createElement('div'); msg.className = 'msg';
      msg.textContent = a.message.replace(/^[^:]*: patient /, (m) => '').replace(/^\w/, c => c.toUpperCase());
      const meta = document.createElement('div'); meta.className = 'meta';
      const btn = document.createElement('button'); btn.className = 'pill';
      btn.innerHTML = 'On my way <span class="go">&#8594;</span>';
      btn.onclick = () => post('/api/ack', {id: a.id});
      body.append(msg, meta); el.append(body, btn);
      $('alerts').prepend(el);
      cards.set(a.id, el);
    }
    el.className = 'alert ' + a.state;
    const at = new Date(a.created_at * 1000).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    const wait = Math.max(0, Math.round((a.acked_at || s.time) - a.created_at));
    el.querySelector('.meta').textContent = a.state === 'acked'
      ? at + ', answered after ' + wait + ' s'
      : (a.urgent ? 'Urgent. ' : a.state === 'escalated' ? 'Overdue. ' : '') + at + ', waiting ' + wait + ' s';
    if (seen.get(a.id) !== a.state) {
      if (a.state === 'escalated') beep(880, 3); else if (a.state === 'pending') beep(660, 1);
      seen.set(a.id, a.state);
    }
  });
  $('empty').style.display = s.alerts.length ? 'none' : 'block';

  const cal = s.calibration;
  $('calibrate').firstChild.textContent = (st.gaze_mode === 'quick' ? 'Re-centre' : 'Start calibration') + ' ';
  const results = Object.entries(s.self_check).map(([k, v]) => k + ' ' + Math.round(v * 100) + '%');
  const weak = Object.entries(s.self_check).filter(([k, v]) => v < 0.7).map(([k]) => k);
  $('calState').textContent = cal.active ? 'Calibrating' : s.calibrated ? 'Ready' : 'Not ready';
  $('calState').className = 'tag ' + (s.calibrated && !cal.active ? 'good' : '');
  $('check').textContent = cal.active ? 'Calibrating: step ' + cal.step + ' of ' + cal.steps
    : cal.error ? cal.error
    : st.simulate ? 'Simulation mode: calibration is not needed.'
    : st.gaze_mode === 'quick' ? (s.calibrated ? 'The device learned the centre from one look at the screen and keeps it up to date.' : (cal.error || 'Waiting for the patient to look at the screen.'))
    : !s.calibrated ? 'Not calibrated.'
    : results.length ? 'Repeat check (second look recognised from the first): ' + results.join(', ')
        + (weak.length ? '. Not reliable: ' + weak.join(', ')
           + '. Move these further from other targets, add light, and calibrate again.' : '')
    : 'Calibrated (loaded from last run).';

  const gm = st.gaze_meter;
  $('meter').textContent = !gm ? '' : !('side' in gm) ? 'Gaze: eyes not readable'
    : 'Gaze: ' + (gm.side >= 1 ? 'left' : gm.side <= -1 ? 'right' : gm.up >= 1 ? 'up' : 'centre')
      + '. Sideways ' + gm.side.toFixed(1) + ', up ' + gm.up.toFixed(1)
      + ' (1.0 is the trigger point; + is the patient\'s left). Head turn ' + gm.head_yaw.toFixed(2)
      + (ses.gaze ? '. Read as: ' + ses.gaze : '');
  previewOn = st.preview;
  $('previewBtn').style.display = st.simulate ? 'none' : '';
  $('previewBtn').textContent = st.preview ? 'Hide camera view' : 'Show camera view';
  $('previewBox').style.display = st.preview ? 'block' : 'none';
  const ff = $('faceFrame');
  if (st.preview && st.face_box) {
    const [x1, y1, x2, y2] = st.face_box;
    ff.style.display = 'block';
    ff.style.left = (x1 * 100) + '%'; ff.style.top = (y1 * 100) + '%';
    ff.style.width = ((x2 - x1) * 100) + '%'; ff.style.height = ((y2 - y1) * 100) + '%';
    ff.style.borderColor = st.gaze_ok ? 'var(--accent)' : 'var(--danger)';
  } else ff.style.display = 'none';
  if (st.preview) {
    const tips = [];
    if (st.face_width == null) tips.push('No face found: aim the camera at the patient.');
    else {
      const pct = Math.round(st.face_width * 100);
      tips.push('Face fills ' + pct + '% of the width'
        + (pct < 22 ? ': too far, move the camera closer.' : pct > 45 ? ': too close, move it back.' : ': good.'));
      tips.push(st.gaze_ok ? 'Eyes readable.' : 'Eyes not readable (red frame).');
    }
    if (st.brightness != null) tips.push('Brightness ' + st.brightness + '/255'
      + (st.brightness < 60 ? ': too dark, add light on the face.' : st.brightness < 100 ? ': a bit dim.' : ': good.'));
    tips.push('Mirrored view. Switches off by itself after 3 minutes.');
    $('previewHelp').textContent = tips.join(' ');
  }

  if (s.scene) {
    const sc = s.scene;
    $('scene').style.display = '';
    $('sceneStatus').textContent = sc.age_s == null ? 'Waiting for the first photo from the scene camera.'
      : sc.error ? sc.error
      : (sc.age_s > 30 ? 'Scene camera silent for ' + Math.round(sc.age_s) + ' s. ' : 'Last photo ' + Math.round(sc.age_s) + ' s ago. ')
        + 'Scan took ' + sc.ms + ' ms. Sees: '
        + (sc.found.map(f => f.label + ' ' + Math.round(f.score * 100) + '%').join(', ') || 'nothing it knows') + '.';
    const lines = sc.spots.map(p => p.side !== undefined
      ? (p.side ? "On the patient's " + p.side + ': ' + p.now + (p.seen ? '' : ' (not visible in the last photo)')
                : p.now + ': too close to the screen to tell left from right. Move it further to one side.')
      : p.zone + ': '
      + (!p.located ? 'not found yet (expecting a ' + p.expected + ')'
         : p.now + (p.now !== p.expected ? ' (was ' + p.expected + ')' : '') + (p.seen ? '' : ', not visible in the last photo')));
    if (st.gaze_mode === 'quick') lines.unshift(sc.screen ? 'Patient screen found in the picture.'
      : 'Patient screen not recognised: aim the scene camera so the screen is in the middle.');
    const list = $('spots');
    if (list.dataset.key !== lines.join('|')) {
      list.dataset.key = lines.join('|');
      list.replaceChildren(...lines.map(t => { const li = document.createElement('li'); li.textContent = t; return li; }));
    }
  }

  if (st.simulate && !debugBuilt) {
    debugBuilt = true;
    $('debug').style.display = 'block';
    $('simHelp').textContent = s.session.more
      ? 'To open the MORE menu (pain, moving, toilet): press "Screen centre", then "NO" and wait 3 seconds. '
        + 'In the menu, "YES" chooses the item shown and "NO" goes to the next one.' : '';
    const opts = [['rest', 'Screen centre'], ['yes', 'YES'], ['no', 'NO']]
      .concat(s.zones.map(z => [z.id, z.label]), [[null, 'Elsewhere'], ['noface', 'Face hidden']]);
    opts.forEach(([id, label]) => {
      const b = document.createElement('button');
      b.className = 'pill soft'; b.style.cssText = 'padding:8px 14px;font-size:13px'; b.textContent = label;
      b.onclick = () => post('/api/debug/gaze', {label: id});
      $('gaze').appendChild(b);
    });
  }
}

$('calibrate').onclick = () => post('/api/calibrate');
let previewOn = false;
$('previewBtn').onclick = () => post('/api/preview', {on: !previewOn});
const pv = $('preview');
let streaming = false;
setInterval(() => {
  if (previewOn && !streaming) { pv.src = '/preview.mjpg?t=' + Date.now(); streaming = true; }
  if (!previewOn && streaming) { pv.removeAttribute('src'); streaming = false; }
}, 300);
pv.onerror = () => { streaming = false; };
$('relearn').onclick = () => post('/api/scene/reset');
$('clearDone').onclick = () => post('/api/alerts/clear');
$('setT').onclick = () => post('/api/debug/temp', {temp_c: parseFloat($('t').value)});
$('clearT').onclick = () => post('/api/debug/temp', {temp_c: null});
let lastMessage = 0, bedName = 'Device';
function offline(text) {
  chip('conn', text, 'bad');
  $('banner').style.display = 'block';
  $('banner').textContent = bedName + ': ' + text.toLowerCase() + '. The patient cannot make requests.';
}
const es = new EventSource('/events?role=nurse');
es.onmessage = e => { lastMessage = Date.now(); const s = JSON.parse(e.data); bedName = s.bed; render(s); };
es.onerror = () => offline('Device offline');
setInterval(() => {
  if (lastMessage && Date.now() - lastMessage > 3000) offline('Device not responding');
}, 1000);
</script>
</body>
</html>
