<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room view · Read the Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; position: relative;
         background: radial-gradient(120% 90% at 50% 40%, #fffdf9 0%, var(--ground) 55%, var(--ground-deep) 100%); }
  header { display: flex; align-items: center; gap: 14px; padding: 22px 32px 6px; }
  header h1 { font-size: 18px; font-weight: 700; letter-spacing: -.02em; margin: 0 auto 0 0; }
  header .state { display: inline-flex; align-items: center; gap: 9px; padding: 7px 14px; border-radius: 999px;
                  background: var(--plate); box-shadow: var(--highlight), var(--shadow); font-size: 14px; color: var(--ink-2); }
  #dot { width: 7px; height: 7px; border-radius: 999px; background: var(--danger); }
  #dot.ok { background: var(--accent); }

  #wrap { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 10px 32px; }
  /* The photo sits in a tray, like a print in a frame. */
  #stage { position: relative; display: none; border-radius: calc(var(--r-xl) - 6px); overflow: hidden;
           background: var(--shell); box-shadow: 0 0 0 6px var(--shell), 0 0 0 7px var(--edge), var(--shadow-lift); }
  #photo { display: block; width: 100%; height: 100%; object-fit: cover; filter: saturate(.9); }
  .spot { position: absolute; left: 0; top: 0; border: 2px solid rgba(255,255,255,.85); border-radius: var(--r-md);
          transition: transform 400ms var(--ease), border-color 300ms var(--ease), box-shadow 300ms var(--ease);
          overflow: hidden; will-change: transform; }
  .spot .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(184,207,179,.55);
                transition: height 100ms linear; }
  .spot.other { border: 1.5px dashed rgba(255,255,255,.45); }
  .spot.looking { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(184,207,179,.5); }
  .spot.asked { border-color: var(--accent); box-shadow: 0 0 0 2px #fff, 0 0 0 5px var(--accent); }
  .spot.calib { border-color: var(--accent); animation: breathe 1.6s var(--ease) infinite; }
  .spot.calib .fill { background: rgba(184,207,179,.35); }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 3px rgba(132,162,130,.4); } 50% { box-shadow: 0 0 0 9px rgba(132,162,130,.12); } }
  .tag { position: absolute; left: 0; top: 0; margin-top: -8px; padding: 6px 12px; border-radius: 999px;
         background: rgba(255,255,255,.92); color: var(--ink); font-size: 13px; font-weight: 600; letter-spacing: 0;
         text-transform: none; box-shadow: var(--shadow); white-space: nowrap;
         transition: transform 400ms var(--ease), background 300ms var(--ease), color 300ms var(--ease); }
  .tag.other { font-weight: 500; color: var(--ink-2); background: rgba(255,255,255,.7); }
  .tag.looking, .tag.asked, .tag.calib { background: var(--accent-deep); color: var(--accent-ink); }

  /* Without a scene camera: one plate per object. */
  #tiles { display: none; gap: 20px; flex-wrap: wrap; justify-content: center; max-width: 1000px; }
  .tile { position: relative; width: 220px; height: 150px; border-radius: var(--r-lg); background: var(--plate);
          box-shadow: var(--highlight), var(--shadow); display: grid; place-items: center; font-size: 20px; font-weight: 700;
          letter-spacing: -.02em; text-align: center; padding: 14px; overflow: hidden; transition: box-shadow 400ms var(--ease); }
  .tile .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--accent-tint); transition: height 100ms linear; }
  .tile span { position: relative; }
  .tile.looking { box-shadow: var(--highlight), var(--shadow), 0 0 0 3px var(--accent); }
  .tile.asked { box-shadow: var(--highlight), var(--shadow-lift), 0 0 0 3px var(--accent); }
  .tile.calib { animation: breathe 1.6s var(--ease) infinite; }

  footer { padding: 12px 32px 26px; display: grid; place-items: center; min-height: 128px; }
  #caption { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 18px 30px; border-radius: var(--r-lg);
             background: var(--plate); box-shadow: var(--highlight), var(--shadow-lift); max-width: 900px; text-align: center; }
  #line { font-size: clamp(22px, 2.6vw, 36px); font-weight: 700; letter-spacing: -.03em; line-height: 1.15; }
  #sub { font-size: 15px; color: var(--ink-2); min-height: 1.3em; }
  #line.asked { color: var(--accent-deep); } #line.sent { color: var(--ink); } #line.calib { color: var(--accent-deep); }
  #steps { display: none; gap: 6px; justify-content: center; margin-top: 4px; }
  #steps i { width: 26px; height: 4px; border-radius: 2px; background: var(--ground-deep); }
  #steps i.done { background: var(--accent); } #steps i.now { background: var(--ink); }
</style>
</head>
<body>
<header>
  <h1 id="title">Read the Room</h1>
  <span class="state"><span id="dot"></span><span id="status">Connecting</span></span>
</header>
<div id="wrap">
  <div id="stage"><img id="photo" alt="The room as the scene camera sees it"></div>
  <div id="tiles"></div>
</div>
<footer>
  <div id="caption">
    <div id="line"></div>
    <div id="sub"></div>
    <div id="steps"></div>
  </div>
</footer>
<script>
const $ = id => document.getElementById(id);
const els = new Map();     // key -> {box, tag} on the photo
const tiles = new Map();   // zone id -> tile
let photoId = -1, lastMessage = 0, calWasActive = false, calEndedAt = 0;

function overlapping(a, b) {
  const w = Math.min(a[2], b[2]) - Math.max(a[0], b[0]), h = Math.min(a[3], b[3]) - Math.max(a[1], b[1]);
  if (w <= 0 || h <= 0) return 0;
  const inter = w * h, union = (a[2]-a[0])*(a[3]-a[1]) + (b[2]-b[0])*(b[3]-b[1]) - inter;
  return inter / union;
}

function place(key, box, size, label, cls, progress) {
  let e = els.get(key);
  if (!e) {
    e = {box: document.createElement('div'), tag: document.createElement('div')};
    e.fill = document.createElement('div'); e.fill.className = 'fill';
    e.box.appendChild(e.fill);
    $('stage').append(e.box, e.tag);
    els.set(key, e);
  }
  const [w, h] = size, [x1, y1, x2, y2] = box;
  e.box.className = 'spot ' + cls; e.tag.className = 'tag ' + cls;
  // Position with transform so moves run on the compositor; only size touches layout.
  const sw = $('stage').clientWidth, sh = $('stage').clientHeight;
  e.box.style.transform = 'translate(' + (x1 / w * sw) + 'px,' + (y1 / h * sh) + 'px)';
  e.box.style.width = ((x2 - x1) / w * 100) + '%'; e.box.style.height = ((y2 - y1) / h * 100) + '%';
  e.tag.style.transform = 'translate(' + (x1 / w * sw) + 'px,' + (Math.max(y1 / h, .07) * sh) + 'px) translateY(-100%)';
  e.tag.textContent = label;
  e.fill.style.height = (progress * 100) + '%';
}

function render(s) {
  const ses = s.session, sc = s.scene, st = s.status;
  $('title').textContent = s.bed + ' · Read the Room';
  $('dot').className = st.face_ok ? 'ok' : '';
  $('status').textContent = st.face_ok ? 'Following the patient\'s gaze' : 'Patient not in view';

  const cal = s.calibration;
  const learning = cal.active ? cal.target : null;   // the target being learned right now
  const asked = !cal.active && ses.state === 'prompt' ? ses.zone : null;
  const looking = !cal.active && ses.state === 'idle' ? ses.leader : null;
  const cls = id => id === learning ? 'calib' : id === asked ? 'asked' : id === looking ? 'looking' : '';
  const prog = id => id === learning ? (cal.recording ? cal.progress : 0) : id === looking ? ses.progress : 0;
  if (calWasActive && !cal.active) calEndedAt = Date.now();
  calWasActive = cal.active;
  const names = Object.fromEntries(s.zones.map(z => [z.id, z.label]));

  const located = sc && sc.size ? sc.spots.filter(p => p.box) : [];
  const usePhoto = located.length > 0;
  $('stage').style.display = usePhoto ? 'block' : 'none';
  $('tiles').style.display = usePhoto ? 'none' : 'flex';

  if (usePhoto) {
    const [w, h] = sc.size;
    const wrap = $('wrap').getBoundingClientRect();
    const scale = Math.min((wrap.width - 52) / w, (wrap.height - 16) / h);
    $('stage').style.width = (w * scale) + 'px'; $('stage').style.height = (h * scale) + 'px';
    if (sc.photo_id !== photoId) { photoId = sc.photo_id; $('photo').src = '/scene.jpg?id=' + photoId; }
    const live = new Set();
    located.forEach(p => {
      live.add('z:' + p.zone);
      place('z:' + p.zone, p.box, sc.size, names[p.zone] || p.now, cls(p.zone), prog(p.zone));
    });
    // Other things the scan recognised, shown faintly. Skip whole-picture boxes.
    sc.found.forEach((f, i) => {
      const area = (f.box[2] - f.box[0]) * (f.box[3] - f.box[1]) / (w * h);
      if (area > 0.6 || located.some(p => overlapping(p.box, f.box) > 0.2)) return;
      live.add('o:' + f.label + i);
      place('o:' + f.label + i, f.box, sc.size, f.label, 'other', 0);
    });
    for (const [key, e] of els) if (!live.has(key)) { e.box.remove(); e.tag.remove(); els.delete(key); }
  } else {
    s.zones.forEach(z => {
      let t = tiles.get(z.id);
      if (!t) {
        t = document.createElement('div');
        t.innerHTML = '<div class="fill"></div><span></span>';
        $('tiles').appendChild(t); tiles.set(z.id, t);
      }
      t.className = 'tile ' + cls(z.id);
      t.querySelector('span').textContent = z.label;
      t.querySelector('.fill').style.height = (prog(z.id) * 100) + '%';
    });
  }

  let line = '', sub = '', lineCls = '';
  const open = s.alerts.find(a => a.state !== 'acked');
  const steps = $('steps');
  steps.style.display = cal.active ? 'flex' : 'none';
  if (cal.active) {
    if (steps.children.length !== cal.steps)
      steps.replaceChildren(...Array.from({length: cal.steps}, () => document.createElement('i')));
    [...steps.children].forEach((el, i) => { el.className = i + 1 < cal.step ? 'done' : i + 1 === cal.step ? 'now' : ''; });
  }
  if (cal.active) {
    line = cal.instruction; lineCls = 'calib';
    sub = (cal.recording ? 'Learning what that looks like' : 'Getting ready')
      + ' · step ' + cal.step + ' of ' + cal.steps;
  } else if (cal.error && Date.now() - calEndedAt < 15000) {
    line = 'Calibration did not finish'; sub = cal.error;
  } else if (Date.now() - calEndedAt < 6000 && s.calibrated) {
    const weak = Object.entries(s.self_check).filter(([k, v]) => v < 0.7).map(([k]) => names[k] || k);
    line = weak.length ? 'Calibrated, with a weak spot' : 'Calibrated'; lineCls = weak.length ? 'asked' : 'sent';
    sub = weak.length ? 'Hard to tell apart: ' + weak.join(', ') + '. Move it further from the others and try again.'
      : 'The device has learned where each object is.';
  } else if (ses.state === 'prompt') {
    line = ses.question; lineCls = 'asked';
    sub = 'Waiting for the patient to answer with their eyes';
  } else if (ses.state === 'menu') {
    line = ses.menu.label; lineCls = 'asked';
    sub = 'Choosing from the menu: ' + (ses.menu.index + 1) + ' of ' + ses.menu.count;
  } else if (ses.state === 'sent') {
    line = 'Sent to the nurse'; lineCls = 'sent';
    sub = s.alerts.length ? s.alerts[0].message : '';
  } else if (looking && names[looking]) {
    line = 'Looking at the ' + names[looking];
  } else if (!s.calibrated) {
    line = 'Waiting for calibration';
  } else {
    line = open ? open.message : 'Watching';
    sub = open ? (open.state === 'escalated' ? 'Still waiting for a nurse' : 'Nurse has been called') : '';
  }
  $('line').textContent = line; $('line').className = lineCls;
  $('sub').textContent = sub;
}

function offline(text) {
  $('dot').className = ''; $('status').textContent = text;
}
const es = new EventSource('/events?role=patient');
es.onmessage = e => { lastMessage = Date.now(); render(JSON.parse(e.data)); };
es.onerror = () => offline('Lost connection to the device');
setInterval(() => { if (lastMessage && Date.now() - lastMessage > 3000) offline('Device not responding'); }, 1000);
</script>
</body>
</html>
