<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Read the Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/theme.css">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; position: relative;
         background: radial-gradient(120% 90% at 50% 40%, #fffdf9 0%, var(--ground) 55%, var(--ground-deep) 100%); }

  /* Two answer plates float at the edges, the question floats between them. */
  .side { position: absolute; top: 7vh; bottom: 7vh; width: 22vw; }
  #yes { left: 2.2vw; } #no { right: 2.2vw; }
  .side .shell, .side .core { height: 100%; }
  .side .core { position: relative; overflow: hidden; display: grid; place-items: center; }
  .side .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--accent-tint);
                transition: height 100ms linear; }  /* a measurement of time, so it moves evenly */
  .side .label { position: relative; font-size: 6.4vw; font-weight: 700; letter-spacing: -.045em;
                 color: var(--ink-3); transition: color 500ms var(--ease), transform 500ms var(--ease); }
  body.prompt .label, body.menu .label { color: var(--ink); }
  body.more #no .label, body.menu #no .label { font-size: 4.6vw; color: var(--ink-2); }

  main { position: absolute; left: 27vw; right: 27vw; top: 7vh; bottom: 7vh; display: grid; place-items: center; }
  main .core { width: 100%; max-width: 760px; padding: 5vh 4vw; display: flex; flex-direction: column;
               align-items: center; text-align: center; gap: 18px; }
  #count { min-height: 26px; }
  #count:empty { display: none; }
  #count { display: inline-flex; }
  #headline { font-size: clamp(30px, 3.4vw, 54px); font-weight: 700; letter-spacing: -.035em; line-height: 1.1;
              max-width: 20ch; margin: 0; }
  #headline.enter { animation: enter 320ms var(--ease); }
  @keyframes enter { from { opacity: 0; transform: translateY(10px); filter: blur(4px); } }
  body.menu #headline { font-size: clamp(40px, 5vw, 76px); }
  #sub { font-size: clamp(15px, 1.25vw, 20px); color: var(--ink-2); line-height: 1.45; max-width: 40ch; min-height: 1.4em; }
  #bar { width: 42%; height: 4px; border-radius: 2px; background: var(--ground-deep); overflow: hidden; visibility: hidden; }
  #bar div { height: 100%; width: 0; background: var(--accent); transition: width 100ms linear; }
  .side.target .core, main.target .core { box-shadow: var(--highlight), var(--shadow), 0 0 0 3px var(--accent); }

  /* Up: a thin line that fills while the patient holds a look upward. Nothing to read there. */
  #moreTop { display: none; position: absolute; top: 0; left: 40%; right: 40%; height: 4px;
             background: var(--ground-deep); border-radius: 0 0 4px 4px; overflow: hidden; }
  #moreTop .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--accent);
                   transition: width 100ms linear; }
  #moreTop span { display: none; }
  body.slots #moreTop { display: block; }
  body.slots .side .shell { background: transparent; box-shadow: none; }
  body.slots .side .core { background: rgba(255, 255, 255, .55); box-shadow: none; }
  body.slots #headline { font-weight: 600; color: var(--ink-2); font-size: clamp(26px, 2.6vw, 40px); }

  /* The island at the bottom: tracking state and any request on its way. */
  #island { position: absolute; left: 50%; bottom: 2.4vh; transform: translateX(-50%); display: flex; align-items: center;
            gap: 10px; padding: 8px 10px 8px 18px; border-radius: 999px; background: var(--plate);
            box-shadow: var(--highlight), var(--shadow-lift); font-size: 15px; white-space: nowrap;
            transition: background 300ms var(--ease); }
  #top { display: flex; align-items: center; gap: 9px; color: var(--ink-2); }
  #dot { width: 7px; height: 7px; border-radius: 999px; background: var(--danger); }
  #dot.ok { background: var(--accent); }
  body.noface #island { background: var(--danger-wash); }
  #calls { display: contents; }
  #calls div { padding: 8px 16px; border-radius: 999px; background: var(--blush); color: var(--ink); font-weight: 600; }
  #calls div.escalated { background: var(--danger-wash); color: var(--danger); }
  #calls div.acked { background: var(--accent-wash); color: var(--accent-deep); font-weight: 600; }

  /* Up/down answers: YES across the top, NO across the bottom. */
  body.vertical .side { left: 6vw; right: 6vw; width: auto; height: 19vh; top: auto; bottom: auto; }
  body.vertical #yes { top: 2.4vh; } body.vertical #no { bottom: 9.5vh; }
  body.vertical .side .label { font-size: 9vh; }
  body.vertical .side .fill { top: 0; right: auto; width: 0; height: 100% !important; transition: width 100ms linear; }
  body.vertical main { left: 12vw; right: 12vw; top: 24vh; bottom: 31vh; }
</style>
</head>
<body>
<div class="side" id="yes"><div class="shell"><div class="core"><div class="fill"></div><span class="label">YES</span></div></div></div>
<main id="centre">
  <div class="shell"><div class="core">
    <span id="count" class="tag"></span>
    <h1 id="headline">Connecting</h1>
    <div id="sub"></div>
    <div id="bar"><div></div></div>
  </div></div>
</main>
<div class="side" id="no"><div class="shell"><div class="core"><div class="fill"></div><span class="label">NO</span></div></div></div>
<div id="moreTop"><div class="fill"></div><span>MORE</span></div>
<div id="island">
  <div id="top"><span id="dot"></span><span id="status"></span></div>
  <div id="calls"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let audio = null, lastState = null, lastItem = null, lastHeadline = '';
document.addEventListener('pointerdown', () => { audio = audio || new AudioContext(); }, {once: true});
function chime(freq) {
  if (!audio) return;
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.value = freq; o.connect(g); g.connect(audio.destination);
  g.gain.setValueAtTime(.15, audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .4);
  o.start(); o.stop(audio.currentTime + .4);
}
let vertical = false;
function fill(id, v) {
  const f = $(id).querySelector('.fill');
  f.style.height = vertical ? '' : (v * 100) + '%';
  f.style.width = vertical ? (v * 100) + '%' : '';
}
function mode(name) { document.body.className = (vertical ? 'vertical ' : '') + name + (document.body.classList.contains('noface') ? ' noface' : ''); }
function setHeadline(text) {
  if (text === lastHeadline) return;   // the same words never re-animate
  lastHeadline = text;
  const h = $('headline');
  h.textContent = text;
  h.classList.remove('enter'); void h.offsetWidth; h.classList.add('enter');
}

function render(s) {
  const ses = s.session, cal = s.calibration, st = s.status;
  vertical = st.answer_mode === 'vertical';
  const yesWay = vertical ? 'up' : 'left', noWay = vertical ? 'down' : 'right';
  mode('');
  ['yes', 'no', 'centre'].forEach(id => $(id).classList.remove('target'));
  fill('yes', 0); fill('no', 0);
  $('bar').style.visibility = 'hidden';
  let headline = '', sub = '', count = '', noText = 'NO', yesText = 'YES';
  const quick = st.gaze_mode === 'quick' && st.sides;
  document.body.classList.toggle('noface', !st.face_ok);
  $('moreTop').querySelector('.fill').style.width = '0';

  if (cal.active) {
    count = 'Setting up';
    headline = cal.instruction;
    sub = cal.recording ? 'Keep looking' : 'Get ready';
    const el = {yes: 'yes', no: 'no', rest: 'centre'}[cal.target];
    if (el) $(el).classList.add('target');
    $('bar').style.visibility = 'visible';
    $('bar').firstElementChild.style.width = (cal.progress * 100) + '%';
  } else if (!s.calibrated && st.gaze_mode === 'quick') {
    headline = 'Getting ready';
    sub = st.face_ok ? 'Look at the screen for a moment.' : 'Waiting to see your face.';
  } else if (!s.calibrated) {
    headline = cal.error ? 'Calibration did not finish' : 'Not set up yet';
    sub = cal.error || 'Ask staff to start calibration.';
  } else if (ses.state === 'prompt') {
    mode('prompt');
    count = 'Question';
    headline = ses.question;
    sub = 'Look ' + yesWay + ' for yes, ' + noWay + ' for no, and hold.';
    if (ses.leader === 'yes') fill('yes', ses.progress);
    if (ses.leader === 'no') fill('no', ses.progress);
  } else if (ses.state === 'menu') {
    mode('menu');
    noText = ses.menu.index + 1 < ses.menu.count ? 'NEXT' : 'CLOSE';
    count = 'Do you need this  ' + (ses.menu.index + 1) + ' of ' + ses.menu.count;
    headline = ses.menu.label;
    sub = 'Look ' + yesWay + ' and hold for yes. Your nurse is told straight away. '
      + 'Look ' + noWay + ' and hold for ' + noText.toLowerCase() + '.';
    if (ses.leader === 'yes') fill('yes', ses.progress);
    if (ses.leader === 'no') fill('no', ses.progress);
  } else if (ses.state === 'sent') {
    count = 'Sent';
    headline = 'Your nurse has been told';
  } else {
    headline = 'Look at what you need';
    if (quick) {
      // Objects sit to the left and right of the screen; up opens the menu.
      // Nothing to pick from on the screen: the patient looks at the real
      // object, and the plate on that side fills to show it has noticed.
      mode('slots');
      yesText = ''; noText = '';
      headline = 'Watching for what you need';
      sub = 'Look at what you want and keep looking.' + (ses.more ? ' Look up for anything else.' : '');
      $('moreTop').style.visibility = ses.more ? 'visible' : 'hidden';
      $('moreTop').querySelector('.fill').style.width = (ses.more_progress * 100) + '%';
      if ((st.sides.left || []).includes(ses.leader)) fill('yes', ses.progress);
      if ((st.sides.right || []).includes(ses.leader)) fill('no', ses.progress);
    } else if (ses.more) {
      mode('more');
      noText = 'MORE';
      sub = 'For pain, moving, the toilet or anything else: look ' + noWay + ' at MORE and keep looking.';
      fill('no', ses.more_progress);
    }
    const zone = quick ? null : s.zones.find(z => z.id === ses.leader);
    if (zone) {
      sub = zone.label;
      $('bar').style.visibility = 'visible';
      $('bar').firstElementChild.style.width = (ses.progress * 100) + '%';
    }
  }
  setHeadline(headline);
  $('sub').textContent = sub;
  $('count').textContent = count;
  $('no').querySelector('.label').textContent = noText;
  $('yes').querySelector('.label').textContent = yesText;

  if (ses.state !== lastState) {
    if (ses.state === 'prompt' || ses.state === 'menu') chime(660);
    if (ses.state === 'sent') chime(880);
    lastState = ses.state;
  }
  const item = ses.menu ? ses.menu.index : null;
  if (item !== lastItem) { if (item) chime(520); lastItem = item; }

  $('dot').className = st.face_ok ? 'ok' : '';
  const bits = [st.face_ok ? 'Tracking' : "Can't see you"];
  if (st.temp_c != null) bits.push(st.temp_c.toFixed(1) + ' °C');
  if (!st.nurse_screens) bits.push('Nurse station not connected');
  $('status').textContent = bits.join('    ');

  const calls = $('calls');
  calls.replaceChildren();
  s.alerts.filter(a => a.state !== 'acked' || s.time - a.acked_at < 60).slice(0, 2).forEach(a => {
    const d = document.createElement('div');
    d.className = a.state;
    const what = a.message.replace(/^[^:]*: patient /, '');
    d.textContent = a.state === 'acked' ? 'Nurse on the way: ' + what
      : a.state === 'escalated' ? 'Still calling: ' + what
      : 'Calling your nurse: ' + what;
    calls.appendChild(d);
  });
}

let lastMessage = 0;
function offline(text) {
  mode('');
  $('count').textContent = '';
  setHeadline(text);
  $('sub').textContent = 'Requests cannot be made right now.';
  $('dot').className = '';
  $('status').textContent = 'Offline';
}
const es = new EventSource('/events?role=patient');
es.onmessage = e => { lastMessage = Date.now(); render(JSON.parse(e.data)); };
es.onerror = () => offline('Lost connection to the device');
setInterval(() => {
  if (lastMessage && Date.now() - lastMessage > 3000) offline('The device has stopped responding');
}, 1000);
</script>
</body>
</html>
